<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10% 할인 이벤트</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .product {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        .product-image {
            width: 100%;
            max-width: 350px;
            border-radius: 12px;
        }

        h1 {
            font-size: 28px;
        }

        h2 {
            margin-top: 25px;
        }

        .original-price {
            color: #888;
            text-decoration: line-through;
            font-size: 18px;
        }

        .sale-price {
            color: #e53935;
            font-size: 32px;
            font-weight: bold;
        }

        .discount {
            color: #e53935;
            font-size: 20px;
            font-weight: bold;
        }

        .description {
            color: #555;
            line-height: 1.6;
        }

        #test-button {
            background: #111;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        #test-button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="product">

        <h1>특별 할인 이벤트</h1>

        <img
            class="product-image"
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"
            alt="프리미엄 운동화"
        >

        <h2>프리미엄 운동화</h2>

        <p class="original-price">₩100,000</p>

        <p class="sale-price">₩90,000</p>

        <p class="discount">10% 할인</p>

        <p class="description">
            지금 구매하시면 특별 할인 혜택을 받을 수 있습니다.
        </p>

        <button id="test-button">
            10% 할인
        </button>

    </div>

</body>
</html>
